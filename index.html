  <script>
    let addBtn=document.getElementById("btn");
    let table=document.getElementById("table");


    let dateInput=document.getElementById("date")
    let toInput=document.querySelector("#to");
    let fromInput=document.querySelector("#from");
    let transportInput=document.querySelector("#transport");
    let purporseInput=document.querySelector("#purporse");
    let amountInput=document.querySelector("#amount")
    addBtn.addEventListener('click',()=>{

        let date=dateInput.value.trim();
        let to=toInput.value;
        let from=fromInput.value;
        let transport=transportInput.value;
        let purporse=purporseInput.value;
        let amount=amountInput.value;

        let templet=`
          <tr>
            <td> ${date} </td>
            <td> ${to} </td>
            <td> ${from} </td>
            <td> ${transport} </td>
            <td> ${purporse} </td>
            <td> ${amount} </td>
            
        </tr>`;
        table.innerHTML += templet;
    })
    <script>

    function exportData(){
      let data=document.getElementById('table');
      let fp=XLSX.utils.table_to_book(data,{sheet:'sarvesh'});
      XLSX.write(fp,{
        bookType:'xlsx',
        type:'base64'
      })
      XLSX.writefile(fp,"Export.xlsx");
    }

  
    // N U this code
/**
 * Export HTML table to Excel file
 * @param {string} tableID - The ID of the HTML table
 * @param {string} filename - Desired filename without extension
 */
function exportTableToExcel(tableID, filename = '') {
    try {
        const table = document.getElementById("table");
        if (!table) {
            alert("Table not found!");
            return;
        }

        // Get table HTML
        const tableHTML = table.outerHTML.replace(/ /g, '%20');

        // Specify file name
        const fileName = filename ? `${filename}.xls` : 'excel_data.xls';

        // Create download link element
        const downloadLink = document.createElement("a");
        document.body.appendChild(downloadLink);

        // For Internet Explorer
        if (navigator.msSaveOrOpenBlob) {
            const blob = new Blob(['\ufeff', tableHTML], { type: 'application/vnd.ms-excel' });
            navigator.msSaveOrOpenBlob(blob, fileName);
        } else {
            // Create a data URI
            downloadLink.href = 'data:application/vnd.ms-excel,' + tableHTML;
            downloadLink.download = fileName;
            downloadLink.click();
        }
    } catch (error) {
        console.error("Export failed:", error);
        alert("An error occurred while exporting the table.");
    }
}
</script>
